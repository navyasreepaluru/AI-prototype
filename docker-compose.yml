version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybershield-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - FLASK_ENV=production
      - SECRET_KEY=cybershield-kalam-innovista-2026-production
    volumes:
      - backend-data:/app/backend
    restart: unless-stopped

volumes:
  backend-data:
